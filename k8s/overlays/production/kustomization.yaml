apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: game-platform

resources:
  - ../../base
  - namespace.yaml
  - pdb.yaml

commonLabels:
  environment: production

patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml
  - path: hpa-patch.yaml
  - path: ingress-patch.yaml

images:
  - name: game-service
    newName: ghcr.io/your-org/game-engine/game-service
    newTag: latest

replicas:
  - name: game-service
    count: 3

configMapGenerator:
  - name: game-service-env
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
