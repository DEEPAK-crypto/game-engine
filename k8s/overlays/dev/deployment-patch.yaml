apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-service
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: game-service
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx384m"
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 5
