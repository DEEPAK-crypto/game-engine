apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: game-platform-dev

resources:
  - ../../base
  - namespace.yaml

namePrefix: dev-

commonLabels:
  environment: dev

patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml

images:
  - name: game-service
    newName: ghcr.io/your-org/game-engine/game-service
    newTag: latest

replicas:
  - name: game-service
    count: 1

configMapGenerator:
  - name: game-service-env
    behavior: merge
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=DEBUG
