  SPRING_DATA_REDIS_HOST: "staging-redis"
  SPRING_CASSANDRA_CONTACT_POINTS: "staging-cassandra"
  RATE_LIMIT_ENABLED: "true"
  LOG_LEVEL: "INFO"
