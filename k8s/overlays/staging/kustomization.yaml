apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: game-platform-staging

resources:
  - ../../base
  - namespace.yaml

namePrefix: staging-

commonLabels:
  environment: staging

patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml
  - path: hpa-patch.yaml

images:
  - name: game-service
    newName: ghcr.io/your-org/game-engine/game-service
    newTag: latest

replicas:
  - name: game-service
    count: 2

configMapGenerator:
  - name: game-service-env
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=INFO
