apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-service
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: game-service
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "staging"
            - name: LOG_LEVEL
              value: "INFO"
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx768m"
