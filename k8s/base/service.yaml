apiVersion: v1
kind: Service
metadata:
  name: game-service
  namespace: game-platform
  labels:
    app.kubernetes.io/name: game-service
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: game-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  sessionAffinity: None
---
# Headless service for direct pod access (useful for debugging)
apiVersion: v1
kind: Service
metadata:
  name: game-service-headless
  namespace: game-platform
  labels:
    app.kubernetes.io/name: game-service
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: game-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP