apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secrets
  namespace: game-platform
  labels:
    app.kubernetes.io/name: postgresql
type: Opaque
stringData:
  # IMPORTANT: Replace with secure values in production
  # Use external secrets management (Vault, AWS Secrets Manager, etc.)
  username: "postgres"
  password: "REPLACE_WITH_SECURE_PASSWORD"
  # Connection string for applications
  connection-string: "postgresql://postgres:REPLACE_WITH_SECURE_PASSWORD@postgresql-primary.game-platform.svc.cluster.local:5432/game_platform"
