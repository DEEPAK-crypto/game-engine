apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: game-platform
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/component: database
spec:
  serviceName: cassandra-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 1800

      securityContext:
        fsGroup: 1001

      # Spread pods across nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cassandra
              topologyKey: kubernetes.io/hostname

      containers:
        - name: cassandra
          image: cassandra:4.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: intra-node
              containerPort: 7000
            - name: tls-intra-node
              containerPort: 7001
            - name: jmx
              containerPort: 7199
            - name: cql
              containerPort: 9042

          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: "GamePlatformCluster"
            - name: CASSANDRA_DC
              value: "datacenter1"
            - name: CASSANDRA_RACK
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: "GossipingPropertyFileSnitch"
            - name: CASSANDRA_SEEDS
              value: "cassandra-0.cassandra-headless.game-platform.svc.cluster.local"
            - name: MAX_HEAP_SIZE
              value: "2G"
            - name: HEAP_NEWSIZE
              value: "512M"
            - name: CASSANDRA_NUM_TOKENS
              value: "256"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"

          # Cassandra takes time to start
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "nodetool status | grep -E '^UN\\s+${POD_IP}'"
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30

          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "nodetool status | grep -E '^UN\\s+${POD_IP}'"
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "nodetool status | grep -E '^UN\\s+${POD_IP}'"
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - "nodetool drain"

          securityContext:
            runAsUser: 1001
            runAsNonRoot: true

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: cassandra
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard  # Change to your storage class
        resources:
          requests:
            storage: 50Gi