apiVersion: v1
kind: ConfigMap
metadata:
  name: game-service-config
  namespace: game-platform
  labels:
    app.kubernetes.io/name: game-service
    app.kubernetes.io/component: config
data:
  # Application settings
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

  # Database URLs (hostnames only, credentials in secrets)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql-primary.game-platform.svc.cluster.local:5432/game_platform"
  SPRING_CASSANDRA_CONTACT_POINTS: "cassandra.game-platform.svc.cluster.local"
  SPRING_CASSANDRA_PORT: "9042"
  SPRING_CASSANDRA_LOCAL_DATACENTER: "datacenter1"
  SPRING_CASSANDRA_KEYSPACE_NAME: "game_platform"
  SPRING_DATA_REDIS_HOST: "redis.game-platform.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"

  # Environment identification
  ENVIRONMENT: "production"

  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_GAMEPLATFORM: "INFO"

  # Game platform settings
  GAME_PLATFORM_DEFAULT_QUESTION_DURATION_SECONDS: "30"
  GAME_PLATFORM_LEADERBOARD_TOP_N: "100"
  GAME_PLATFORM_RATE_LIMIT_ENABLED: "true"