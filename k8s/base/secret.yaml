apiVersion: v1
kind: Secret
metadata:
  name: game-service-secrets
  namespace: game-platform
  labels:
    app.kubernetes.io/name: game-service
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # PostgreSQL credentials
  # IMPORTANT: Replace these with actual secrets in production
  # Use external secrets management (Vault, AWS Secrets Manager, etc.)
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"

  # Redis password (if enabled)
  SPRING_DATA_REDIS_PASSWORD: ""

  # Cassandra credentials (if enabled)
  SPRING_CASSANDRA_USERNAME: ""
  SPRING_CASSANDRA_PASSWORD: ""
---
