apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: game-platform
  labels:
    app.kubernetes.io/name: prometheus
data:
  game-platform-alerts.yml: |
    groups:
      - name: game-platform.rules
        rules:
          # ===========================================
          # APPLICATION ALERTS
          # ===========================================

          # High Error Rate
          - alert: HighErrorRate
            expr: |
              sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (app)
              /
              sum(rate(http_server_requests_seconds_count[5m])) by (app)
              > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.app }}"

          # High Latency P99
          - alert: HighLatencyP99
            expr: |
              histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, app))
              > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High P99 latency detected"
              description: "P99 latency is {{ $value | humanizeDuration }} for {{ $labels.app }}"

          # High Latency P99 Critical
          - alert: HighLatencyP99Critical
            expr: |
              histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, app))
              > 2
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Critical P99 latency"
              description: "P99 latency is {{ $value | humanizeDuration }} for {{ $labels.app }}"

          # ===========================================
          # POD HEALTH ALERTS
          # ===========================================

          # Pod CrashLooping
          - alert: PodCrashLooping
            expr: |
              increase(kube_pod_container_status_restarts_total[1h]) > 5
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod is crash looping"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value }} times in the last hour"

          # Pod Not Ready
          - alert: PodNotReady
            expr: |
              kube_pod_status_ready{condition="true"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod not ready"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been not ready for 10 minutes"

          # High Memory Usage
          - alert: HighMemoryUsage
            expr: |
              container_memory_working_set_bytes{container!=""}
              / container_spec_memory_limit_bytes{container!=""}
              > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of memory limit"

          # High CPU Usage
          - alert: HighCPUUsage
            expr: |
              rate(container_cpu_usage_seconds_total{container!=""}[5m])
              / container_spec_cpu_quota{container!=""} * 100000
              > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of CPU limit"

          # ===========================================
          # DATABASE ALERTS
          # ===========================================

          # PostgreSQL Connection Pool Exhausted
          - alert: PostgreSQLConnectionPoolExhausted
            expr: |
              hikaricp_connections_active / hikaricp_connections_max > 0.9
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL connection pool near exhaustion"
              description: "Connection pool is {{ $value | humanizePercentage }} utilized"

          # PostgreSQL Down
          - alert: PostgreSQLDown
            expr: pg_up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL is down"
              description: "PostgreSQL instance {{ $labels.instance }} is unreachable"

          # Redis Memory High
          - alert: RedisMemoryHigh
            expr: |
              redis_memory_used_bytes / redis_memory_max_bytes > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Redis memory usage high"
              description: "Redis is using {{ $value | humanizePercentage }} of max memory"

          # Redis Down
          - alert: RedisDown
            expr: redis_up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Redis is down"
              description: "Redis instance {{ $labels.instance }} is unreachable"

          # Cassandra Node Down
          - alert: CassandraNodeDown
            expr: |
              up{job="cassandra"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Cassandra node down"
              description: "Cassandra node {{ $labels.instance }} is unreachable"

          # ===========================================
          # GAME PLATFORM SPECIFIC ALERTS
          # ===========================================

          # No Active Games During Peak Hours
          - alert: NoActiveGamesDuringPeak
            expr: |
              game_active_count == 0
              and hour() >= 18 and hour() <= 23
            for: 30m
            labels:
              severity: info
            annotations:
              summary: "No active games during peak hours"
              description: "There are no active games between 6PM and 11PM"

          # Game Stuck in Active State
          - alert: GameStuckInActiveState
            expr: |
              time() - game_state_changed_timestamp{state="ACTIVE"} > 7200
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Game stuck in active state"
              description: "Game {{ $labels.game_id }} has been active for over 2 hours"

          # High Answer Submission Latency
          - alert: HighAnswerSubmissionLatency
            expr: |
              histogram_quantile(0.99, sum(rate(game_answer_submission_seconds_bucket[5m])) by (le))
              > 0.2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High answer submission latency"
              description: "P99 answer submission latency is {{ $value | humanizeDuration }}"

          # Budget Overspend
          - alert: BudgetOverspend
            expr: |
              game_rewards_distributed_total > game_budget_total
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Game budget overspent"
              description: "Game {{ $labels.game_id }} has distributed more rewards than budget allows"

          # ===========================================
          # INFRASTRUCTURE ALERTS
          # ===========================================

          # Disk Space Low
          - alert: DiskSpaceLow
            expr: |
              (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Disk space running low"
              description: "Filesystem {{ $labels.mountpoint }} has only {{ $value | humanizePercentage }} space left"

          # Prometheus Storage Getting Full
          - alert: PrometheusStorageFull
            expr: |
              prometheus_tsdb_storage_blocks_bytes / (1024*1024*1024*10) > 0.8
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus storage getting full"
              description: "Prometheus storage is {{ $value | humanizePercentage }} full"