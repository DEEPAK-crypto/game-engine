apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: game-platform
  labels:
    app.kubernetes.io/name: alertmanager
data:
  alertmanager.yml: |
    global:
      # SMTP configuration for email alerts
      # smtp_smarthost: 'smtp.gmail.com:587'
      # smtp_from: 'alertmanager@game-platform.com'
      # smtp_auth_username: 'alertmanager@game-platform.com'
      # smtp_auth_password: 'password'

      # Slack configuration
      slack_api_url: 'REPLACE_WITH_SLACK_WEBHOOK_URL'

      # PagerDuty configuration
      # pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

      resolve_timeout: 5m

    # Templates for notifications
    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    # Routing tree
    route:
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-notifications'

      routes:
        # Critical alerts go to PagerDuty and Slack
        - match:
            severity: critical
          receiver: 'critical-alerts'
          continue: true

        # Warning alerts go to Slack only
        - match:
            severity: warning
          receiver: 'slack-notifications'

        # Info alerts are less urgent
        - match:
            severity: info
          receiver: 'slack-info'
          group_wait: 1m
          repeat_interval: 24h

    # Inhibition rules
    inhibit_rules:
      # If critical alert is firing, suppress warning for same alertname
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname']

    # Receivers
    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#game-platform-alerts'
            send_resolved: true
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
            color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

      - name: 'critical-alerts'
        slack_configs:
          - channel: '#game-platform-critical'
            send_resolved: true
            title: 'CRITICAL: {{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
            color: 'danger'
        # pagerduty_configs:
        #   - service_key: 'REPLACE_WITH_PAGERDUTY_SERVICE_KEY'
        #     severity: 'critical'
        #     description: '{{ template "pagerduty.description" . }}'

      - name: 'slack-info'
        slack_configs:
          - channel: '#game-platform-monitoring'
            send_resolved: true
            title: 'INFO: {{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
            color: '#439FE0'

  # Notification templates
  templates.tmpl: |
    {{ define "slack.title" }}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
    {{ end }}

    {{ define "slack.text" }}
    {{ range .Alerts }}
    *Alert:* {{ .Annotations.summary }}
    *Description:* {{ .Annotations.description }}
    *Severity:* {{ .Labels.severity }}
    {{ if .Labels.pod }}*Pod:* {{ .Labels.pod }}{{ end }}
    {{ if .Labels.namespace }}*Namespace:* {{ .Labels.namespace }}{{ end }}
    *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
    {{ end }}
    {{ end }}

    {{ define "pagerduty.description" }}
    {{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}
    {{ end }}