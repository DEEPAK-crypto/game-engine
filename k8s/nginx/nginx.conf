worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request timing
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=answers:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream for game service instances
    upstream game_service {
        least_conn;
        keepalive 100;

        # Docker Compose service discovery
        server game-service:8080 max_fails=3 fail_timeout=30s;
    }

    # Health check upstream (no load balancing needed)
    upstream game_service_health {
        server game-service:8080;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Connection limits
        limit_conn conn_limit 50;

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://game_service_health/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # Prometheus metrics (internal only in production)
        location /actuator/prometheus {
            proxy_pass http://game_service_health/actuator/prometheus;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # In production, restrict to internal IPs
            # allow 10.0.0.0/8;
            # deny all;
        }

        # Actuator endpoints
        location /actuator {
            proxy_pass http://game_service_health/actuator;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Answer submission endpoint (stricter rate limiting)
        location ~ ^/api/games/[^/]+/questions/[^/]+/answer$ {
            limit_req zone=answers burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://game_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # API endpoints
        location /api {
            limit_req zone=general burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://game_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # WebSocket endpoint (future)
        location /ws {
            proxy_pass http://game_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # Default - return 404
        location / {
            return 404 '{"error": "Not Found"}';
            add_header Content-Type application/json;
        }

        # Error pages
        error_page 429 = @rate_limit_error;
        location @rate_limit_error {
            default_type application/json;
            return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please slow down."}';
        }

        error_page 502 503 504 = @upstream_error;
        location @upstream_error {
            default_type application/json;
            return 503 '{"error": "Service Unavailable", "message": "The service is temporarily unavailable. Please try again later."}';
        }
    }

    # HTTPS server (uncomment when SSL certs are available)
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #
    #     ssl_certificate /etc/nginx/ssl/tls.crt;
    #     ssl_certificate_key /etc/nginx/ssl/tls.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     # Include same location blocks as HTTP server above
    # }
}