server:
  port: 8080

spring:
  application:
    name: game-service

  datasource:
    url: jdbc:postgresql://localhost:5432/game_platform
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cassandra:
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: game_platform
    schema-action: none
    field-naming-strategy: org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
      region: ${AWS_REGION:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s
    export:
      prometheus:
        enabled: true
        step: 1m
        descriptions: true

logging:
  level:
    root: INFO
    com.gameplatform.game: DEBUG
    org.jooq: INFO
    org.springframework.data.cassandra: INFO
    org.springframework.data.cassandra.core.cql: DEBUG
