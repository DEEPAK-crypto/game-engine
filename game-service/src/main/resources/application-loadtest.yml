# Configuration optimized for load testing with high concurrency
server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 500                    # Increased from default 200
      min-spare: 50               # Keep threads ready
    max-connections: 10000        # Allow more concurrent connections
    accept-count: 1000            # Queue size for pending connections
    connection-timeout: 30000     # 30 seconds

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: game-service

  datasource:
    url: jdbc:postgresql://localhost:5432/game_platform
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100      # Increased from 10 to handle concurrent DB ops
      minimum-idle: 20            # Keep connections ready
      idle-timeout: 300000        # 5 minutes
      connection-timeout: 10000   # 10 seconds (faster fail)
      max-lifetime: 1800000       # 30 minutes
      leak-detection-threshold: 60000  # Detect connection leaks

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cassandra:
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: game_platform
    schema-action: none
    field-naming-strategy: org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
    connection:
      connect-timeout: 10s
      init-query-timeout: 10s
    pool:
      idle-timeout: 120s
      heartbeat-interval: 30s
      max-requests-per-connection: 1024  # Increase concurrent requests per connection
    request:
      timeout: 10s

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000               # 5 second timeout
      lettuce:
        pool:
          enabled: true
          max-active: 100         # Maximum active connections
          max-idle: 20            # Maximum idle connections
          min-idle: 10            # Minimum idle connections
          max-wait: 5000          # Maximum wait time for connection (ms)
        shutdown-timeout: 200

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: loadtest
      region: ${AWS_REGION:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s
    export:
      prometheus:
        enabled: true
        step: 1m
        descriptions: true

logging:
  level:
    root: WARN                    # Reduce logging overhead during load test
    com.gameplatform.game: INFO   # Keep service logs at INFO
    org.jooq: WARN
    org.springframework.data.cassandra: WARN
    org.springframework.data.cassandra.core.cql: WARN
    org.springframework.web: WARN